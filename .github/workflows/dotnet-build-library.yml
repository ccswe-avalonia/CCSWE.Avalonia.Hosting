name: Build, test, and publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  checks: write
  packages: write
  pull-requests: read

jobs:
  # Keep the id: the required check is `pipeline / build`.
  pipeline:
    uses: ccswe-apps/actions/.github/workflows/dotnet-build-library.yml@master
    with:
      nuget-org: true
      path: src
      discover-dependents: |
        ccswe-apps
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}

  # nuget.org Trusted Publishing: the CCSWE organization's policy names this repo and this file.
  publish:
    needs: pipeline
    if: needs.pipeline.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      indexed: ${{ steps.publish.outputs.indexed }}
    steps:
      - id: publish
        uses: ccswe-apps/actions/.github/actions/nuget-org-publish@master
        with:
          user: CoryCharlton
          packages: ${{ needs.pipeline.outputs.packages }}
          version: ${{ needs.pipeline.outputs.version }}

  # Runs on every build (PRs log the discovered set); sends only once nuget.org serves the publish.
  dependents:
    needs: [pipeline, publish]
    if: ${{ !cancelled() && needs.pipeline.result == 'success' && needs.pipeline.outputs.owners != '' }}
    permissions:
      contents: read
    uses: ccswe-apps/actions/.github/workflows/dispatch-dependents.yml@master
    with:
      owners: ${{ needs.pipeline.outputs.owners }}
      updater: ccswe-apps/actions/.github/workflows/dotnet-update-dependencies.yml
      version: ${{ needs.pipeline.outputs.version }}
      packages: ${{ needs.pipeline.outputs.packages }}
      only: ${{ needs.pipeline.outputs.only }}
      send: ${{ needs.publish.result == 'success' && needs.publish.outputs.indexed == 'true' }}
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
